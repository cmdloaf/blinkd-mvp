<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkd — {% block title %}Upload{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; color: #111; }
        h1 { margin-bottom: 0.25rem; }
        textarea { width: 100%; box-sizing: border-box; padding: 0.75rem; font-size: 1rem; font-family: inherit; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 0.6rem 1.5rem; background: #111; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        .btn:hover { background: #333; }
        .btn-outline { padding: 0.6rem 1.5rem; background: #fff; color: #111; border: 1px solid #111; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        .btn-outline:hover { background: #f5f5f5; }
        .step-indicator { display: flex; gap: 1.5rem; margin-bottom: 2rem; color: #999; font-size: 0.9rem; }
        .step-indicator .active { color: #111; font-weight: bold; }
        .step-indicator .done { color: #4a4; }
        .screenshot-list { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
        .screenshot-item { border: 1px solid #ccc; padding: 0.25rem; cursor: grab; border-radius: 4px; background: #fafafa; }
        .screenshot-item img { max-width: 150px; max-height: 150px; display: block; }
        .screenshot-item small { display: block; text-align: center; margin-top: 0.25rem; color: #666; font-size: 0.75rem; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .errorlist { color: #c00; list-style: none; padding: 0; }
        .persona-cards { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
        .persona-card { border: 2px solid #ddd; border-radius: 8px; padding: 1rem; cursor: pointer; transition: border-color 0.15s; }
        .persona-card:hover { border-color: #888; }
        .persona-card.selected { border-color: #111; background: #f9f9f9; }
        .persona-card input[type="radio"] { display: none; }
        .persona-card h3 { margin: 0 0 0.25rem 0; font-size: 1.05rem; }
        .persona-card p { margin: 0 0 0.5rem 0; color: #555; font-size: 0.9rem; }
        .persona-card .traits { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .persona-card .trait { background: #eee; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.8rem; color: #444; }
        .custom-textarea { display: none; margin-top: 0.75rem; }
        .custom-textarea.visible { display: block; }
        .disclaimer { color: #966; font-size: 0.85rem; margin-top: 0.5rem; font-style: italic; }
        .analysis-section { margin: 1.5rem 0; padding: 1rem; background: #f8f8f8; border-radius: 6px; border-left: 3px solid #111; }
        .analysis-content { white-space: pre-wrap; line-height: 1.6; }
        .muted { color: #888; font-size: 0.85rem; }

        /* Section navigation */
        .section-nav { display: flex; gap: 0.5rem; margin: 1.5rem 0; flex-wrap: wrap; position: sticky; top: 0; background: #fff; padding: 0.5rem 0; z-index: 10; border-bottom: 1px solid #eee; }
        .section-nav a { padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: #333; font-size: 0.85rem; }
        .section-nav a:hover { background: #eee; }
        .section-nav a.active { background: #111; color: #fff; border-color: #111; }

        /* Recommendation summary bar */
        .rec-summary { display: flex; gap: 1rem; padding: 0.75rem 1rem; background: #f0f0f0; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem; }

        /* Recommendation cards */
        .rec-card { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; border-left: 4px solid #ddd; }
        .rec-card.rec-priority-high { border-left-color: #dc3545; }
        .rec-card.rec-priority-med { border-left-color: #f0ad4e; }
        .rec-card.rec-priority-low { border-left-color: #5cb85c; }
        .rec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .rec-number { font-weight: bold; font-size: 1.1rem; }
        .rec-priority { padding: 0.2rem 0.6rem; border-radius: 3px; font-size: 0.75rem; font-weight: bold; letter-spacing: 0.05em; }
        .priority-high { background: #dc3545; color: #fff; }
        .priority-med { background: #f0ad4e; color: #111; }
        .priority-low { background: #5cb85c; color: #fff; }
        .rec-label { font-weight: 600; color: #555; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .rec-field { margin-bottom: 0.5rem; }
        .rec-field p { margin: 0.2rem 0 0 0; line-height: 1.5; }

        /* Friction cards */
        .friction-card { border: 1px solid #eee; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; border-left: 4px solid #ddd; }
        .friction-card.friction-high { border-left-color: #dc3545; }
        .friction-card.friction-med { border-left-color: #f0ad4e; }
        .friction-card.friction-low { border-left-color: #5cb85c; }
        .friction-header { margin-bottom: 0.5rem; }

        /* Simulation steps */
        .sim-step { border: 1px solid #eee; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
        .sim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .sim-step-num { font-weight: bold; font-size: 1rem; }
        .sim-verdict { font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 3px; font-size: 0.75rem; letter-spacing: 0.05em; }
        .verdict-continue { background: #d4edda; color: #155724; }
        .verdict-hesitate { background: #fff3cd; color: #856404; }
        .verdict-drop { background: #f8d7da; color: #721c24; }
        .sim-monologue { font-style: italic; color: #555; margin-bottom: 0.75rem; line-height: 1.5; }
        .sim-details { margin-top: 0.5rem; }

        /* Product understanding */
        .understanding-content { white-space: pre-wrap; line-height: 1.6; padding: 1rem; background: #f8f8f8; border-radius: 6px; }

        /* Loading screen */
        .loading-container { text-align: center; padding: 4rem 1rem; }
        .loading-container h2 { margin: 1.5rem 0 0.5rem; font-size: 1.5rem; }
        .loading-subtext { color: #555; font-size: 1rem; margin-bottom: 0.25rem; }
        .loading-persona { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .loading-message { color: #666; font-size: 0.95rem; font-style: italic; transition: opacity 0.3s ease; min-height: 1.4em; }
        .spinner { width: 48px; height: 48px; border: 4px solid #eee; border-top-color: #111; border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn:disabled { background: #999; cursor: not-allowed; }

        /* Section spacing */
        section { margin-bottom: 2.5rem; }
        section h3 { margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #eee; }

        /* Confirmation screen */
        .confirm-section { border: 1px solid #eee; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .confirm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .confirm-header h3 { margin: 0; border-bottom: none; padding-bottom: 0; }
        .confirm-content { line-height: 1.6; white-space: pre-wrap; color: #333; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; }

        /* ── Dashboard Layout ── */
        body.dashboard-layout { max-width: 1100px; }

        .executive-summary { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
        .executive-summary h3 { margin: 0 0 0.75rem 0; border: none; padding: 0; color: #fff; font-size: 1.25rem; }
        .clarity-badge { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
        .clarity-clear { background: rgba(92,184,92,0.9); color: #fff; }
        .clarity-unclear { background: rgba(220,53,69,0.9); color: #fff; }
        .clarity-mixed { background: rgba(240,173,78,0.9); color: #111; }
        .exec-summary-text { font-size: 1.05rem; line-height: 1.6; color: rgba(255,255,255,0.92); }
        .exec-concerns { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,0.15); }
        .exec-concerns h4 { margin: 0 0 0.5rem 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.7); }
        .exec-concerns ul { margin: 0; padding-left: 1.25rem; }
        .exec-concerns li { margin-bottom: 0.4rem; line-height: 1.5; color: rgba(255,255,255,0.85); font-size: 0.95rem; }

        .dashboard-stats { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .stat-card { flex: 1; min-width: 140px; background: #f8f9fa; border-radius: 8px; padding: 1.25rem; border-left: 4px solid #ccc; }
        .stat-card.stat-critical { border-left-color: #dc3545; }
        .stat-card.stat-warning { border-left-color: #f0ad4e; }
        .stat-card.stat-info { border-left-color: #17a2b8; }
        .stat-number { font-size: 2rem; font-weight: bold; line-height: 1; margin-bottom: 0.25rem; }
        .stat-label { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .dashboard-panel { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; }
        .panel-header { padding: 1rem 1.25rem; border-bottom: 2px solid #f0f0f0; background: #fafafa; border-radius: 8px 8px 0 0; }
        .panel-header h3 { margin: 0; padding: 0; border: none; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
        .panel-count { display: inline-flex; align-items: center; justify-content: center; background: #111; color: #fff; border-radius: 12px; padding: 0.15rem 0.5rem; font-size: 0.75rem; font-weight: bold; min-width: 22px; }
        .panel-body { padding: 1.25rem; }

        .compact-card { border: 1px solid #e8e8e8; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; border-left: 4px solid #ddd; transition: box-shadow 0.2s; }
        .compact-card:last-child { margin-bottom: 0; }
        .compact-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .compact-card.sev-high { border-left-color: #dc3545; background: #fff5f5; }
        .compact-card.sev-med { border-left-color: #f0ad4e; background: #fffbf5; }
        .compact-card.sev-low { border-left-color: #5cb85c; background: #f5fff5; }
        .compact-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.4rem; gap: 0.5rem; }
        .compact-card-title { font-weight: 600; font-size: 0.95rem; line-height: 1.4; color: #222; flex: 1; }
        .compact-card-body { font-size: 0.9rem; line-height: 1.5; color: #555; }
        .compact-card-meta { margin-top: 0.5rem; }
        .pattern-id-badge { display: inline-block; background: #e9ecef; color: #495057; padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }

        .expandable-details { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #f0f0f0; display: none; }
        .expandable-details.expanded { display: block; }
        .expand-toggle { background: none; border: none; color: #4a6cf7; font-size: 0.85rem; cursor: pointer; padding: 0.25rem 0; margin-top: 0.5rem; font-weight: 500; }
        .expand-toggle:hover { color: #3451b2; text-decoration: underline; }

        .collapsible-section { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 2rem; overflow: hidden; }
        .collapsible-header { background: #f8f9fa; padding: 1rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .collapsible-header:hover { background: #e9ecef; }
        .collapsible-header h3 { margin: 0; border: none; padding: 0; font-size: 1.1rem; }
        .collapsible-toggle { font-size: 1.25rem; font-weight: bold; color: #666; transition: transform 0.2s; }
        .collapsible-section.collapsed .collapsible-toggle { transform: rotate(-90deg); }
        .collapsible-body { padding: 1.25rem; }
        .collapsible-section.collapsed .collapsible-body { display: none; }

        .empty-state { text-align: center; padding: 2rem; color: #999; font-style: italic; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <h1>Blinkd</h1>
    <div class="step-indicator">
        <span class="{% if step == 1 %}active{% elif step > 1 %}done{% endif %}">1. Background</span>
        <span class="{% if step == 2 %}active{% elif step > 2 %}done{% endif %}">2. Screenshots</span>
        <span class="{% if step == 3 %}active{% elif step > 3 %}done{% endif %}">3. Persona</span>
        <span class="{% if step == 4 %}active{% elif step > 4 %}done{% endif %}">4. Goals</span>
    </div>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
